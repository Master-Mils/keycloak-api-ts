name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, lint, types, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install the packed tarball and load it from CommonJS and ESM
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null
          npm install --no-audit --no-fund ./keycloak-api-ts-*.tgz
          node -e "const { KeycloakAPI } = require('keycloak-api-ts'); if (typeof KeycloakAPI !== 'function') process.exit(1)"
          node --input-type=module -e "import KeycloakAPI from 'keycloak-api-ts'; if (typeof KeycloakAPI !== 'function') process.exit(1)"

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # testcontainers (integration only) needs Node >= 22.22; unit tests do not load it.
      - run: npm ci --ignore-scripts --engine-strict=false
      - run: npm test

  integration:
    name: Integration (Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    needs: [quality, unit]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        keycloak: [24.0.5, 25.0.6, 26.8.1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integration
        env:
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
