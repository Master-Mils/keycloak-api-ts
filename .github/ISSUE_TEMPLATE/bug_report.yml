name: Bug report
description: A call returns the wrong result, fails or has a wrong type.
labels: [bug]
body:
  - type: input
    id: lib-version
    attributes:
      label: keycloak-api-ts version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: keycloak-version
    attributes:
      label: Keycloak server version
      placeholder: 26.8.1
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: '22.11.0'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code that shows the problem. Remove secrets.
      render: ts
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual and expected result
      description: Include the returned `status` and `error`, if any.
    validations:
      required: true
